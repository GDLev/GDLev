name: Generate contribution snake

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'
      - 'scripts/remove-progress.py'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%237F2036&color_dots=%23ebedf0,%23F5D2D8,%23E99AA8,%23D96378,%23C8344B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23F3A6B5&color_dots=%23161b22,%23431F2A,%23702A3C,%239D3044,%23C8344B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove bottom progress bar
        run: python3 scripts/remove-progress.py

      - name: Save animations in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-snake.svg dist/github-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update contribution snake animations"
            git push
          fi
